<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <title>Günün Notları ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #ff5d82;
      --primary-dark: #e04168;
      --accent: #ff9ebb;
      --text: #2a2228;
      --text-muted: #73646f;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px 16px 40px;
      color: var(--text);
      position: relative;
      background-image: url('arkaplan.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #121013;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    /* Kartlar */
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 16px 18px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    }

    .badge {
      display: inline-block;
      background: rgba(255, 222, 231, 0.95);
      color: var(--primary-dark);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .quote-text {
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.5;
      color: #271f25;
    }

    /* Şarkı Kartı */
    .song-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .song-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .song-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(255, 240, 245, 0.7);
      padding: 10px 14px;
      border-radius: 14px;
    }
    .song-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }
    .song-disc {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #ff758f, #ff477e);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 16px;
      flex-shrink: 0;
      animation: spin 8s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .song-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .song-details .title {
      font-size: 13.5px;
      font-weight: 700;
      color: #271f25;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    .song-details .artist {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
    }
    .song-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .listen-btn {
      background: #1db954;
      color: #ffffff !important;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(29, 185, 84, 0.35);
      cursor: pointer;
    }
    .new-song-btn {
      background: #ffffff;
      border: 1px solid #ffd1dc;
      color: var(--primary-dark);
      width: 34px;
      height: 34px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    /* Başlık ve Tarih */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .header h2 {
      font-size: 21px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    }
    .date-picker-wrap input {
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #2b2229;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      outline: none;
    }

    /* Görev Ekleme */
    .input-box {
      display: flex;
      gap: 8px;
    }
    .input-box input {
      flex: 1;
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 13px 16px;
      border-radius: 16px;
      font-size: 14.5px;
      color: #271f25;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      outline: none;
    }
    .input-box input::placeholder {
      color: #8b7a86;
    }
    .input-box button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 0 20px;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255, 93, 130, 0.5);
      transition: transform 0.1s;
    }
    .input-box button:active {
      transform: scale(0.94);
    }

    /* Plan Listesi */
    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .todo-item {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
      transition: all 0.2s ease;
    }
    .todo-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      cursor: pointer;
    }
    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: white;
      transition: all 0.15s ease;
    }
    .todo-item.done .checkbox {
      background: var(--primary);
      border-color: var(--primary);
    }
    .checkbox svg {
      display: none;
      width: 13px;
      height: 13px;
      fill: none;
      stroke: white;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .todo-item.done .checkbox svg {
      display: block;
    }
    .todo-item.done .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .task-title {
      font-size: 14.5px;
      font-weight: 500;
      color: #271f25;
      word-break: break-word;
    }
    .delete-btn {
      background: none;
      border: none;
      color: #e5989b;
      cursor: pointer;
      font-size: 17px;
      padding: 4px 6px;
    }
    .empty-state {
      text-align: center;
      color: #2a2228;
      font-weight: 600;
      font-size: 13.5px;
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      padding: 12px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Günün Sözü Kartı -->
    <div class="glass-card">
      <div class="badge">Günün Tebessümü 🌸</div>
      <div id="quoteText" class="quote-text">...</div>
    </div>

    <!-- Şarkı Öneri Kartı -->
    <div class="glass-card song-card">
      <div class="song-header">
        <div class="badge">Günün Şarkısı 🎵</div>
        <button type="button" class="new-song-btn" onclick="getRandomSong()" title="Başka şarkı öner">🔄</button>
      </div>
      <div class="song-content">
        <div class="song-info">
          <div class="song-disc">🎶</div>
          <div class="song-details">
            <div id="songTitle" class="title">Şarkı Yükleniyor...</div>
            <div id="songArtist" class="artist">Sanatçı</div>
          </div>
        </div>
        <div class="song-actions">
          <a id="songLink" class="listen-btn" href="#" target="_blank" rel="noopener noreferrer">Dinle ▶</a>
        </div>
      </div>
    </div>

    <div class="header">
      <h2>Planlar</h2>
      <div class="date-picker-wrap">
        <input type="date" id="dateSelector" />
      </div>
    </div>

    <div class="input-box">
      <input type="text" id="taskInput" placeholder="Neler planlıyorsun? ✍️" />
      <button type="button" id="addBtn">+</button>
    </div>

    <ul id="todoList" class="todo-list"></ul>
    <div id="emptyState" class="empty-state" style="display: none;">
      Bu güne ait bir plan görünmüyor ✨
    </div>
  </div>

  <script>
    const compliments = [

      "Bugün de harikasın, bunu sakın unutma!",
      "Her şey yoluna girecek, adımlarına güven. 🌿",
      "Seninleyken zamanın nasıl aktığını unutuyorum.",
      "Düşüncelerin ve zekan her zaman hayranlık uyandırıcı.",
      "Bugün karşına çıkacak tüm zorlukları rahatlıkla aşacaksın.",
      "Kalbinin güzelliği yüzüne yansıyor. 🌷",
      "Sadece kendin olman bile etrafına ilham veriyor.",
      "Ne kadar yorulsan da o tatlı tebessümün hiç solmasın.",
      "Bugün kendine bir kahve ısmarla ve biraz mola ver. ☕",
      "Sen her şeyin en güzelini hak ediyorsun.",
      "Seninle konuşmak günün tüm yorgunluğunu unutturuyor.",
      "Hayallerinin peşinden gitmekten asla vazgeçme.",
      "İçindeki güç tahmin ettiğinden çok daha büyük.",
      "Günün harika geçsin, şans hep seninle olsun! 🍀",
      "Detaylara verdiğin özen seni bambaşka biri yapıyor.",
      "Gözlerin her baktığı yere neşe taşıyor.",
      "Bugün birine gülümsemek istersen ilk aynaya gülümse. 😊",
      "Yıldızlar kadar parlak bir günün olsun.",
      "Her adımında arkanda kocaman bir destek var.",
      "Zihninin pırıltısı hayran bırakıyor.",
      "Kendi mucizeni yaratacak güç tam olarak kalbinde.",
      "Bugün hayatına güzellikler aksın.",
      "Sıradan bir anı bile maceraya dönüştürmeyi başarıyorsun.",
      "Sakinliğin ve duruşun insana huzur veriyor.",
      "Tüm hedeflerine adım adım yaklaşıyorsun.",
      "Günün enerjisi senin kadar parlak olsun! ☀️",
      "Neşeli bir kahkahan tüm dertleri unutturabilir.",
      "İyi ki varsın, iyi ki hayatımdasın. 💖",
      "Bugün senin yeteneklerinin parlayacağı bir gün.",
      "Kendine olan inancını hiç kaybetme, her şey harika olacak.",
      "Senin olduğun her yer daha renkli ve sıcak.",
      "Bugünü kendi hızında ve huzurla yaşa.",
      "Güzelliğin kelimelerin ötesinde. 🌺",
      "Yolun açık, kalbin ferah olsun bugün.",
      "En ufak bir dokunuşun bile her şeyi toparlamaya yetiyor.",
      "Kendine biraz zaman ayırmayı ve şımartmayı ihmal etme.",
      "Yüreğin kadar aydınlık bir gün seni bekliyor.",
      "Sen başarmak istedikten sonra imkansız diye bir şey yok.",
      "Enerjinle etrafını aydınlatmaya devam et.",
      "Günün her saati sana huzur ve mutluluk getirsin.",
      "Düşündüğünden çok daha cesur ve yeteneklisin.",
      "Senin dünyanda yer almak harika bir duygu.",
      "Bugün küçük sürprizlerle dolu güzel bir gün olsun! 🎁",
      "Hayat senin sevginle çok daha anlamlı.",
      "Gözlerindeki heyecan hiçbir zaman eksilmesin.",
      "Her zorluk, senin ne kadar güçlü olduğunu hatırlatmak için var.",
      "Tebessümün bu günün en güzel başlangıcı.",
      "Bugün aklından geçen tüm güzellikler gerçekleşsin.",
      "Sen her gün biraz daha çiçek açıyorsun. 🌼",
      "İyi kalpliliğin dünyaya verilmiş en güzel hediye.",
      "Seninle paylaşılan her sohbet çok değerli.",
      "Bugün hedeflerini tam on ikiden vuracaksın!",
      "İçindeki umut her zaman yolunu aydınlatsın.",
      "Zarafetin her detayda kendini belli ediyor.",
      "Bugün bol bol dinlenmeyi ve su içmeyi unutma. 💧",
      "Günün harika geçmesi için bir neden ara: Aynaya bak!",
      "Seninle konuşurken zaman duruyor sanki.",
      "Başarılarınla gurur duyuyorum, hep parlamaya devam et.",
      "Kalbindeki merhamet seni paha biçilmez kılıyor.",
      "Bugün hayat sana en güzel kapılarını açsın.",
      "Gülüşün gökyüzündeki gökkuşağı gibi.",
      "Senin gücün fırtınaları bile dindirir.",
      "Her yeni sabah seninle anlam kazanıyor.",
      "Bugün kendine bolca şefkat göster. 🤍",
      "Bütün yorgunlukların uçup gideceği harika bir gün olsun.",
      "Hayata kattığın o tatlı enerjiyi kimse taklit edemez.",
      "Kendine hedefler koyarken sınır tanıma.",
      "Işığın hiçbir bulutun ardında gizlenemez.",
      "Bugün gülümsemek için onlarca sebebin olacak.",
      "Gözlerinin derinliğinde huzur var.",
      "Bugün de her gün olduğu gibi çok değerlisin.",
      "Senin başaramayacağın hiçbir şey yok, adım atman yeterli.",
      "Yürüyüşün, gülüşün, duruşun... Her şeyinle çok özelsin.",
      "Yeni bir güne enerjinle hayat ver! 🌈",
      "Kendine inanmaktan vazgeçmediğin sürece kazanırsın.",
      "Seni düşünmek bile yüzümde tebessüm oluşturuyor.",
      "Bugün tüm şans melekleri yanında olsun.",
      "Günün her anı sana mutluluk taşısın.",
      "Sen hayatın en zarif detayısın.",
      "Aklına koyduğun her şey senin ellerinde çiçek açar. 🌸",
      "Bugün de harika bir hikaye yazacaksın, tadını çıkar!"

    const songs = [
      { title: "Ay Tenli Kadın", artist: "Ufuk Beydemir", query: "Ufuk Beydemir Ay Tenli Kadın" },
      { title: "Toprak Yağmura", artist: "Can Ozan", query: "Can Ozan Toprak Yağmura" },
      { title: "Diğer Yarım", artist: "Ate", query: "Ate Diğer Yarım" },
      { title: "Sen Benim Şarkılarımsın", artist: "Cem Adrian", query: "Cem Adrian Sen Benim Şarkılarımsın" },
      { title: "Ben Seni Çok Sevdim", artist: "Cem Adrian", query: "Cem Adrian Ben Seni Çok Sevdim" },
      { title: "Gel Be Gökyüzüm", artist: "İlyas Yalçıntaş", query: "İlyas Yalçıntaş Gel Be Gökyüzüm" },
      { title: "Shawty", artist: "Shawty", query: "Shawty Kabul Olan Tek Duamsın" },
      { title: "Böyle Sever", artist: "Kahraman Deniz", query: "Kahraman Deniz Böyle Sever" },
      { title: "Seni Kendime Sakladım", artist: "Duman", query: "Duman Seni Kendime Sakladım" },
      { title: "Gözleri Aşka Gülen", artist: "Zeki Müren", query: "Zeki Müren Gözleri Aşka Gülen" },
      { title: "Bir Beyaz Orkide", artist: "Cihan Mürtezaoğlu", query: "Cihan Mürtezaoğlu Bir Beyaz Orkide" },
      { title: "Benimle Uçar mısın?", artist: "Yalın", query: "Yalın Benimle Uçar mısın" },
      { title: "Sarı Sonbahar", artist: "Pinhani", query: "Pinhani Sarı Sonbahar" },
      { title: "Until I Found You", artist: "Stephen Sanchez", query: "Stephen Sanchez Until I Found You" },
      { title: "Golden Hour", artist: "JVKE", query: "JVKE Golden Hour" },
      { title: "Yellow", artist: "Coldplay", query: "Coldplay Yellow" },
      { title: "Sparks", artist: "Coldplay", query: "Coldplay Sparks" }
    ];

    function getRandomSong() {
      const randomSong = songs[Math.floor(Math.random() * songs.length)];
      document.getElementById("songTitle").innerText = randomSong.title;
      document.getElementById("songArtist").innerText = randomSong.artist;
      document.getElementById("songLink").href = `https://open.spotify.com/search/${encodeURIComponent(randomSong.query)}`;
    }

    getRandomSong();

    document.getElementById("quoteText").innerText = 
      compliments[Math.floor(Math.random() * compliments.length)];

    const dateSelector = document.getElementById("dateSelector");
    dateSelector.value = new Date().toISOString().split("T")[0];

    function getTasks() {
      return JSON.parse(localStorage.getItem("afra_plans") || "{}");
    }

    function saveTasks(tasks) {
      localStorage.setItem("afra_plans", JSON.stringify(tasks));
    }

    function renderTasks() {
      const selectedDate = dateSelector.value;
      const allTasks = getTasks();
      const currentList = allTasks[selectedDate] || [];
      const listElement = document.getElementById("todoList");
      const emptyState = document.getElementById("emptyState");

      listElement.innerHTML = "";

      if (currentList.length === 0) {
        emptyState.style.display = "block";
      } else {
        emptyState.style.display = "none";
        currentList.forEach((task, index) => {
          const li = document.createElement("li");
          li.className = `todo-item ${task.done ? "done" : ""}`;
          li.innerHTML = `
            <div class="todo-left" onclick="toggleTask(${index})">
              <div class="checkbox">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </div>
              <span class="task-title">${task.text}</span>
            </div>
            <button type="button" class="delete-btn" onclick="deleteTask(${index})">✕</button>
          `;
          listElement.appendChild(li);
        });
      }
    }

    function addTask() {
      const input = document.getElementById("taskInput");
      const text = input.value.trim();
      if (!text) return;

      const selectedDate = dateSelector.value;
      const allTasks = getTasks();
      if (!allTasks[selectedDate]) allTasks[selectedDate] = [];

      allTasks[selectedDate].push({ text, done: false });
      saveTasks(allTasks);
      input.value = "";
      renderTasks();
    }

    window.toggleTask = function(index) {
      const selectedDate = dateSelector.value;
      const allTasks = getTasks();
      allTasks[selectedDate][index].done = !allTasks[selectedDate][index].done;
      saveTasks(allTasks);
      renderTasks();
    };

    window.deleteTask = function(index) {
      const selectedDate = dateSelector.value;
      const allTasks = getTasks();
      allTasks[selectedDate].splice(index, 1);
      saveTasks(allTasks);
      renderTasks();
    };

    document.getElementById("addBtn").addEventListener("click", addTask);
    document.getElementById("taskInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") addTask();
    });
    dateSelector.addEventListener("change", renderTasks);

    renderTasks();
  </script>
</body>
</html>
